<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;}body{overscroll-behavior:none;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = {darkMode: "class", theme: {extend: {"colors": {"background": "#f7f9fb", "on-tertiary-fixed": "#131b2e", "on-secondary": "#ffffff", "secondary-fixed-dim": "#b7c8e1", "surface-bright": "#f7f9fb", "on-primary-container": "#fefcff", "secondary-fixed": "#d3e4fe", "outline": "#727785", "surface-tint": "#005ac2", "outline-variant": "#c2c6d6", "primary": "#0058be", "surface-variant": "#e0e3e5", "on-tertiary-fixed-variant": "#3f465c", "tertiary-container": "#6c748b", "surface-container-high": "#e6e8ea", "surface-container": "#eceef0", "on-secondary-container": "#54647a", "primary-fixed-dim": "#adc6ff", "on-primary-fixed-variant": "#004395", "tertiary": "#545c72", "on-error-container": "#93000a", "secondary": "#505f76", "on-tertiary": "#ffffff", "surface-dim": "#d8dadc", "inverse-on-surface": "#eff1f3", "on-background": "#191c1e", "on-surface": "#191c1e", "inverse-primary": "#adc6ff", "on-primary": "#ffffff", "surface-container-lowest": "#ffffff", "error-container": "#ffdad6", "primary-container": "#2170e4", "surface": "#f7f9fb", "error": "#ba1a1a", "on-primary-fixed": "#001a42", "on-surface-variant": "#424754", "secondary-container": "#d0e1fb", "on-secondary-fixed": "#0b1c30", "inverse-surface": "#2d3133", "on-tertiary-container": "#fefcff", "on-error": "#ffffff", "primary-fixed": "#d8e2ff", "surface-container-low": "#f2f4f6", "tertiary-fixed": "#dae2fd", "tertiary-fixed-dim": "#bec6e0", "on-secondary-fixed-variant": "#38485d", "surface-container-highest": "#e0e3e5"}, "borderRadius": {"DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem"}, "spacing": {"margin": "2rem", "space-md": "1rem", "space-lg": "1.5rem", "space-xs": "0.25rem", "space-xl": "2.5rem", "gutter": "1.5rem", "space-sm": "0.5rem"}, "fontFamily": {"headline-xl": ["Inter"], "label-sm": ["Inter"], "body-md": ["Inter"], "headline-xs": ["Inter"], "body-sm": ["Inter"], "headline-sm": ["Inter"], "headline-md": ["Inter"], "body-lg": ["Inter"], "label-md": ["Inter"], "headline-lg": ["Inter"]}}}</script><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/><style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head><body class="bg-surface font-body-md text-on-surface flex flex-col min-h-screen pt-safe pb-safe"><main class="flex flex-col relative w-full flex-1 bg-surface"><div class="flex flex-col w-full min-h-screen justify-between p-6 bg-surface">
<div class="flex-1 flex flex-col justify-center items-center max-w-sm mx-auto w-full py-8">
<!-- Branding Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-12 h-12 bg-primary text-on-primary rounded-xl flex items-center justify-center mb-4 shadow-sm">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
<h1 class="font-headline-md text-on-surface mb-1">NovaWorks CRM</h1>
<p class="font-body-md text-on-surface-variant">Enterprise Relationship Platform</p>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-6 shadow-[0px_4px_20px_-2px_rgba(15,23,42,0.06)] flex flex-col gap-5">
<div class="flex flex-col gap-1.5">
<label class="font-label-md text-on-surface">Work Email</label>
<input class="w-full px-4 py-3 bg-surface rounded-xl text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all" placeholder="name@company.com" type="email"/>
</div>
<div class="flex flex-col gap-1.5">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface">Password</label>
<a class="font-label-md text-primary hover:underline" href="#">Forgot?</a>
</div>
<input class="w-full px-4 py-3 bg-surface rounded-xl text-on-surface font-body-md focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all" placeholder="••••••••••••" type="password"/>
</div>
<button class="w-full mt-2 bg-primary text-on-primary py-3 rounded-xl font-headline-xs shadow-sm hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2" onclick="handleSignIn(this)">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
<!-- Enterprise Security Badge -->
<div class="flex items-center justify-center gap-2 mt-8 text-on-surface-variant opacity-80">
<span class="material-symbols-outlined text-base">lock</span>
<span class="font-label-sm">Protected by 256-bit TLS Enterprise Encryption</span>
</div>
</div>
<!-- Footer Info -->
<div class="text-center py-4">
<p class="font-label-sm text-on-surface-variant">© 2024 NovaWorks Inc. All rights reserved.</p>
</div>
</div>
<script>
  function handleSignIn(btn) {
    const originalText = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-sm">progress_activity</span><span>Authenticating...</span>';
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1500);
  }
</script></main></body></html>
